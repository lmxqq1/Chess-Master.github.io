<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a1120">
<title>棋大师 · 七类棋艺合集</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#080e1a;--bg2:#101a2c;--card:rgba(255,255,255,.045);--card2:rgba(255,255,255,.08);
  --line:rgba(255,255,255,.1);--txt:#e8eefb;--dim:#8ea1c0;--dim2:#61748f;
  --acc:#3ddad7;--acc2:#f0b429;--bad:#ff6b6b;--good:#57d98a;
  --r:16px;
}
html,body{margin:0;padding:0;height:100%}
body{
  background:
    radial-gradient(900px 520px at 12% -8%,rgba(61,218,215,.14),transparent 60%),
    radial-gradient(800px 500px at 92% 4%,rgba(240,180,41,.1),transparent 60%),
    linear-gradient(180deg,#0d1728 0%,var(--bg) 60%);
  color:var(--txt);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
  min-height:100%;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;font-size:14px}
.app{max-width:1180px;margin:0 auto;padding:0 14px 40px;min-height:100%}
.hidden{display:none!important}

/* ---------- 顶栏 ---------- */
.topbar{display:flex;align-items:center;gap:12px;padding:16px 4px 10px;position:sticky;top:0;z-index:20;
  background:linear-gradient(180deg,rgba(8,14,26,.92),rgba(8,14,26,0));backdrop-filter:blur(8px)}
.brand{font-size:22px;font-weight:800;letter-spacing:1px;display:flex;align-items:center;gap:8px;
  background:linear-gradient(92deg,#7ff0ee,#f7cf6a);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .lg{font-size:24px;-webkit-text-fill-color:initial}
.topbar .sub{color:var(--dim);font-size:12px;margin-left:auto;letter-spacing:.5px}
.ghost{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--card);
  border:1px solid var(--line);color:var(--dim);font-size:13px}
.ghost:active{transform:scale(.96)}

/* ---------- 首页 ---------- */
.hero{padding:14px 4px 22px}
.hero h1{margin:0 0 8px;font-size:30px;line-height:1.25;letter-spacing:.5px}
.hero p{margin:0;color:var(--dim);font-size:14px;max-width:640px}
.cat{margin:22px 0 0}
.catHead{display:flex;align-items:center;gap:12px;padding:0 4px 10px}
.catIcon{width:40px;height:40px;flex:0 0 40px;display:grid;place-items:center;font-size:21px;border-radius:12px;
  background:linear-gradient(150deg,rgba(61,218,215,.18),rgba(240,180,41,.12));border:1px solid var(--line)}
.catName{font-size:17px;font-weight:700;letter-spacing:.5px}
.catDesc{font-size:12px;color:var(--dim2)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px}
.card{position:relative;text-align:left;padding:14px;border-radius:var(--r);background:var(--card);
  border:1px solid var(--line);transition:.18s;overflow:hidden}
.card:before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(61,218,215,.12),transparent 55%);opacity:0;transition:.25s}
.card:hover{border-color:rgba(61,218,215,.4);transform:translateY(-2px)}
.card:hover:before{opacity:1}
.card:active{transform:scale(.98)}
.card .gi{font-size:26px}
.card .gn{font-size:16px;font-weight:700;margin-top:6px}
.card .gd{font-size:12px;color:var(--dim);margin-top:2px;min-height:34px}
.card .gm{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.07);color:var(--dim);border:1px solid var(--line)}
.tag.on{background:rgba(61,218,215,.15);color:#8ff0ee;border-color:rgba(61,218,215,.35)}

/* ---------- 设置页 ---------- */
.setup{max-width:520px;margin:0 auto;padding:8px 0 30px}
.setup .stitle{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800;margin:6px 0 4px}
.setup .sdesc{color:var(--dim);font-size:13px;margin:0 0 18px}
.grp{margin-bottom:16px}
.grp>label{display:block;font-size:12px;color:var(--dim2);margin-bottom:8px;letter-spacing:1px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px}
.opt{padding:10px 12px;border-radius:12px;background:var(--card);border:1px solid var(--line);text-align:left;transition:.15s}
.opt b{display:block;font-size:14px;font-weight:600}
.opt span{display:block;font-size:11px;color:var(--dim2);margin-top:2px}
.opt.sel{background:linear-gradient(140deg,rgba(61,218,215,.2),rgba(61,218,215,.06));border-color:rgba(61,218,215,.55)}
.ruleBox{padding:12px 14px;border-radius:12px;background:rgba(0,0,0,.22);border:1px solid var(--line);
  font-size:12.5px;color:var(--dim);white-space:pre-wrap;max-height:190px;overflow:auto;line-height:1.75}
.big{width:100%;padding:15px;border-radius:14px;font-size:16px;font-weight:800;letter-spacing:2px;
  background:linear-gradient(96deg,#31c9c6,#3f8ef0 55%,#f0b429);color:#06202b;box-shadow:0 10px 26px rgba(49,201,198,.22)}
.big:active{transform:scale(.985)}

/* ---------- 对局页 ---------- */
#play{display:flex;flex-direction:column;height:100dvh;max-height:100dvh;padding:0 14px}
.pTop{display:flex;align-items:center;gap:10px;padding:12px 0 8px;flex:0 0 auto}
.pTop .t{font-size:18px;font-weight:800}
.pTop .m{font-size:11px;color:var(--dim);border:1px solid var(--line);padding:2px 9px;border-radius:999px}
#boardWrap{flex:1 1 auto;min-height:0;display:grid;place-items:center;position:relative}
#board{touch-action:manipulation;border-radius:14px;display:block}
.status{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;background:var(--card);
  border:1px solid var(--line);margin:8px 0;font-size:13.5px;flex:0 0 auto;min-height:44px}
.dot{width:11px;height:11px;border-radius:50%;flex:0 0 11px;box-shadow:0 0 0 3px rgba(255,255,255,.07)}
.status .msg{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctrls{display:flex;gap:8px;flex-wrap:wrap;flex:0 0 auto;padding-bottom:10px}
.btn{padding:9px 14px;border-radius:11px;background:var(--card2);border:1px solid var(--line);font-size:13px;transition:.15s}
.btn:active{transform:scale(.96)}
.btn.pri{background:linear-gradient(96deg,rgba(61,218,215,.28),rgba(63,142,240,.24));border-color:rgba(61,218,215,.45);font-weight:700}
.btn:disabled{opacity:.4}
.rules{margin-bottom:20px;flex:0 0 auto}
.rules summary{cursor:pointer;font-size:12.5px;color:var(--dim);padding:6px 2px;list-style:none}
.rules summary::-webkit-details-marker{display:none}
.rules summary:before{content:"▸ ";color:var(--acc)}
.rules[open] summary:before{content:"▾ "}
.rules .body{font-size:12.5px;color:var(--dim);white-space:pre-wrap;line-height:1.8;padding:8px 12px;
  border-radius:12px;background:rgba(0,0,0,.2);border:1px solid var(--line);max-height:34vh;overflow:auto}

@media(min-width:900px){
  #play{max-width:1180px;display:block;height:auto}
  .pWrap{display:flex;gap:18px;align-items:flex-start;margin-top:6px}
  #boardWrap{flex:0 0 auto;width:min(70vh,700px);height:min(70vh,700px)}
  .side{flex:1 1 auto;min-width:280px;max-width:420px}
  .rules .body{max-height:40vh}
}

/* ---------- 账号 ---------- */
.acct{display:flex;align-items:center;gap:7px;padding:6px 13px 6px 8px;border-radius:999px;
  background:var(--card);border:1px solid var(--line);color:var(--txt);font-size:13px;max-width:44vw}
.acct:active{transform:scale(.96)}
.acct .av{width:24px;height:24px;flex:0 0 24px;display:grid;place-items:center;border-radius:50%;
  background:linear-gradient(150deg,rgba(61,218,215,.3),rgba(240,180,41,.22));font-size:13px}
.acct .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.formRow{margin:10px 0}
.formRow input{width:100%;padding:13px 14px;border-radius:12px;font-size:15px;outline:none;
  background:rgba(0,0,0,.32);border:1px solid var(--line);color:var(--txt)}
.formRow input:focus{border-color:rgba(61,218,215,.6)}
.formRow .tip{font-size:11.5px;color:var(--dim2);margin-top:5px;line-height:1.5}
.formRow .err{font-size:12.5px;color:var(--bad);margin-top:6px;min-height:16px}
.tabs{display:flex;gap:8px;margin:4px 0 12px}
.tabs button{flex:1;padding:10px;border-radius:11px;background:var(--card);border:1px solid var(--line);
  color:var(--dim);font-size:14px}
.tabs button.sel{background:rgba(61,218,215,.16);border-color:rgba(61,218,215,.5);color:var(--txt);font-weight:700}
.acctCard{display:flex;align-items:center;gap:12px;padding:13px;border-radius:14px;
  background:var(--card);border:1px solid var(--line);margin:6px 0 12px}
.acctCard .big{width:46px;height:46px;flex:0 0 46px;display:grid;place-items:center;border-radius:50%;font-size:22px;
  background:linear-gradient(150deg,rgba(61,218,215,.3),rgba(240,180,41,.22))}
.acctCard .who{flex:1;min-width:0}
.acctCard .who b{display:block;font-size:16px}
.acctCard .who span{font-size:12px;color:var(--dim2)}
.statGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0 14px}
.statGrid div{text-align:center;padding:11px 4px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.statGrid b{display:block;font-size:19px;font-weight:800}
.statGrid span{font-size:11px;color:var(--dim2)}
.userItem{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:12px;margin-bottom:8px;
  background:var(--card);border:1px solid var(--line);cursor:pointer}
.userItem:active{transform:scale(.98)}
.userItem.cur{border-color:rgba(61,218,215,.5);background:rgba(61,218,215,.09)}
.userItem .av{width:32px;height:32px;flex:0 0 32px;display:grid;place-items:center;border-radius:50%;
  background:rgba(255,255,255,.09);font-size:15px}
.userItem .who{flex:1;min-width:0}
.userItem .who b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.userItem .who span{font-size:11.5px;color:var(--dim2)}
.userItem .del{padding:6px 10px;border-radius:8px;background:rgba(255,107,107,.14);color:var(--bad);font-size:12px}

/* ---------- 二维码与扫码 ---------- */
.qrWrap{display:flex;align-items:center;gap:16px;margin:14px 0 6px;padding:14px;border-radius:18px;
  background:linear-gradient(150deg,rgba(61,218,215,.14),rgba(240,180,41,.08));border:1px dashed rgba(61,218,215,.45)}
.qrCv{width:132px;height:132px;flex:0 0 132px;border-radius:10px;background:#fff;padding:6px;
  box-shadow:0 6px 18px rgba(0,0,0,.35)}
.qrSide{flex:1;min-width:0;text-align:center}
.qrSide .lb{font-size:11.5px;color:var(--dim);letter-spacing:2px}
.qrSide .cv{font-size:32px;font-weight:800;letter-spacing:6px;margin:4px 0 4px;text-indent:6px;
  font-family:"SF Mono",Menlo,Consolas,monospace;
  background:linear-gradient(92deg,#7ff0ee,#f7cf6a);-webkit-background-clip:text;background-clip:text;color:transparent}
.qrSide .hint{font-size:11px;color:var(--dim2);line-height:1.5}
@media (max-width:400px){ .qrWrap{flex-direction:column;gap:10px} .qrCv{width:110px;height:110px;flex-basis:110px} }

.scanBox{position:relative;width:100%;aspect-ratio:1/1;max-width:340px;margin:12px auto 0;
  border-radius:18px;overflow:hidden;background:#000}
.scanBox video{width:100%;height:100%;object-fit:cover;display:block}
.scanFrame{position:absolute;inset:14%;pointer-events:none}
.scanFrame i{position:absolute;width:26px;height:26px;border:3px solid var(--acc);border-radius:4px}
.scanFrame i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0}
.scanFrame i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0}
.scanFrame i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0}
.scanFrame i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0}

/* ---------- 联机房间 ---------- */
.codeBox{margin:14px 0 6px;padding:20px 10px;border-radius:18px;text-align:center;
  background:linear-gradient(150deg,rgba(61,218,215,.16),rgba(240,180,41,.08));border:1px dashed rgba(61,218,215,.5)}
.codeBox .lb{font-size:11.5px;color:var(--dim);letter-spacing:2px}
.codeBox .cv{font-size:40px;font-weight:800;letter-spacing:9px;margin:6px 0 2px;
  font-family:"SF Mono",Menlo,Consolas,monospace;text-indent:9px;
  background:linear-gradient(92deg,#7ff0ee,#f7cf6a);-webkit-background-clip:text;background-clip:text;color:transparent}
.codeBox .hint{font-size:11.5px;color:var(--dim2)}
.seats{margin:14px 0}
.seat{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:12px;margin-bottom:8px;
  background:var(--card);border:1px solid var(--line);font-size:14px}
.seat.me{border-color:rgba(61,218,215,.5);background:rgba(61,218,215,.09)}
.seat.wait{opacity:.55;border-style:dashed}
.seat .no{width:26px;height:26px;flex:0 0 26px;display:grid;place-items:center;border-radius:50%;
  background:rgba(255,255,255,.09);font-size:12px;font-weight:700}
.seat .nm{flex:1}
.seat .st{font-size:12px;color:var(--dim2)}
.seat.me .st{color:#8ff0ee}
.netBar{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:12px;font-size:12.5px;
  background:rgba(0,0,0,.25);border:1px solid var(--line);color:var(--dim);margin-bottom:14px}
.netBar .led{width:8px;height:8px;border-radius:50%;background:var(--dim2);flex:0 0 8px}
.netBar.ok .led{background:var(--good);box-shadow:0 0 8px var(--good);animation:blink 1.6s infinite}
.netBar.wait .led{background:var(--acc2);animation:blink .8s infinite}
.netBar.err .led{background:var(--bad)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.codeIn{width:100%;padding:16px;border-radius:14px;font-size:28px;letter-spacing:8px;text-align:center;
  text-indent:8px;font-family:"SF Mono",Menlo,Consolas,monospace;font-weight:700;text-transform:uppercase;
  background:rgba(0,0,0,.3);border:1px solid var(--line);color:var(--txt);outline:none}
.codeIn:focus{border-color:rgba(61,218,215,.6)}
.codeIn::placeholder{color:var(--dim2);letter-spacing:6px;font-size:20px}
.nameIn{width:100%;padding:12px 14px;border-radius:12px;font-size:15px;background:rgba(0,0,0,.3);
  border:1px solid var(--line);color:var(--txt);outline:none;margin-top:10px}
.nameIn:focus{border-color:rgba(61,218,215,.6)}

/* ---------- 弹窗 / toast ---------- */
.mask{position:fixed;inset:0;background:rgba(4,8,16,.72);backdrop-filter:blur(6px);z-index:60;
  display:grid;place-items:center;padding:24px;animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
.dlg{width:100%;max-width:400px;background:linear-gradient(160deg,#16233a,#0d1526);border:1px solid var(--line);
  border-radius:20px;padding:22px;text-align:center;animation:pop .22s cubic-bezier(.2,1.2,.4,1);box-shadow:0 24px 60px rgba(0,0,0,.5)}
.dlg .ic{font-size:44px}
.dlg h3{margin:8px 0 4px;font-size:21px}
.dlg p{margin:0 0 16px;color:var(--dim);font-size:13.5px;white-space:pre-wrap}
.dlg .row{display:flex;gap:10px}
.dlg .row .btn{flex:1;padding:12px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:34px;z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.tt{background:rgba(12,20,34,.94);border:1px solid var(--line);color:var(--txt);padding:9px 16px;border-radius:999px;
  font-size:13px;animation:pop .2s ease;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.foot{text-align:center;color:var(--dim2);font-size:11.5px;padding:26px 0 10px;line-height:1.8}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand" id="btnHome"><span class="lg">♟</span>棋大师</div>
    <div class="sub">七类棋理 · 五种模式</div>
    <button class="acct" id="btnAcct"><span class="av">👤</span><span class="nm">未登录</span></button>
  </header>

  <main id="pageHome">
    <div class="hero">
      <h1>把棋盘的道理，一次下明白</h1>
      <p>按<b>胜利条件</b>分为七类：到达、占地、成型、灭子、取子、争子、得分。每类配一款经典棋种，支持人机对弈、联机对弈、同设备轮流、一人多弈与机机演示。</p>
      <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap">
        <button class="btn pri" id="btnHomeJoin" style="padding:12px 18px">🔑 用邀请码加入房间</button>
        <button class="btn" id="btnHomeHost" style="padding:12px 18px">📡 我要开房间</button>
      </div>
    </div>
    <div id="catList"></div>
    <div class="foot">棋大师 · 单文件运行 · 除联机对弈外，所有对局均在本机完成<br>联机对弈通过公共 MQTT 服务器同步局面，仅传输棋局数据</div>
  </main>

  <section id="pageSetup" class="setup hidden"></section>

  <section id="pageRoom" class="setup hidden"></section>

  <section id="pagePlay" class="hidden">
    <div class="pTop">
      <button class="ghost" id="btnBack">← 返回</button>
      <div class="t" id="pTitle">对局</div>
      <div class="m" id="pMode">人机对弈</div>
    </div>
    <div class="pWrap">
      <div id="boardWrap"><canvas id="board"></canvas></div>
      <div class="side">
        <div class="status"><span class="dot" id="sDot"></span><span id="sTurn">轮到</span><span class="msg" id="sMsg"></span></div>
        <div class="ctrls" id="ctrls"></div>
        <details class="rules"><summary>规则说明</summary><div class="body" id="pRules"></div></details>
      </div>
    </div>
  </section>
</div>
<div id="modalRoot"></div>
<div id="toast"></div>
<script>

/* ======== 05_mqtt.js ======== */
/* ===== 极简 MQTT 3.1.1 over WebSocket 客户端（零依赖） =====
   仅实现 CONNECT / CONNACK / SUBSCRIBE / SUBACK / PUBLISH / PINGREQ / DISCONNECT
   足够支撑"房间广播 + 点对点消息"的联机需求 */
(function(global){
'use strict';

function encLen(n,out){ // MQTT 剩余长度变长编码
  do{ let b=n%128; n=Math.floor(n/128); if(n>0)b|=0x80; out.push(b); }while(n>0);
}
function encStr(s){ // UTF-8 字符串 → [len_hi,len_lo,...bytes]
  const bytes=[];
  const u=unescape(encodeURIComponent(s));
  for(let i=0;i<u.length;i++) bytes.push(u.charCodeAt(i));
  return [bytes.length>>8, bytes.length&255].concat(bytes);
}
function strBytes(s){
  const u=unescape(encodeURIComponent(s)); const a=new Array(u.length);
  for(let i=0;i<u.length;i++)a[i]=u.charCodeAt(i);
  return a;
}
function decStr(buf,off){
  const len=(buf[off]<<8)|buf[off+1];
  let s=''; const slice=buf.slice(off+2,off+2+len);
  // 手动 UTF-8 解码
  for(let i=0;i<slice.length;){
    let c=slice[i++];
    if(c<0x80) s+=String.fromCharCode(c);
    else if(c<0xE0){ s+=String.fromCharCode(((c&31)<<6)|(slice[i++]&63)); }
    else { s+=String.fromCharCode(((c&15)<<12)|((slice[i++]&63)<<6)|(slice[i++]&63)); }
  }
  return {s:s,next:off+2+len};
}
function decRemain(buf,off){
  let mul=1,val=0,i=off,b;
  do{ b=buf[i++]; val+=(b&127)*mul; mul*=128; }while((b&128)!==0);
  return {v:val,next:i};
}

function MiniMQTT(url,opts){
  opts=opts||{};
  this.url=url;
  this.clientId=opts.clientId||('qm'+Math.random().toString(36).slice(2,10));
  this.onopen=opts.onopen||function(){};
  this.onclose=opts.onclose||function(){};
  this.onerror=opts.onerror||function(){};
  this.onmessage=opts.onmessage||function(){};   // (topic, payloadStr)
  this.keepalive=opts.keepalive||40;
  this.ws=null; this.buf=[]; this.connected=false; this.pid=1; this.pingT=0;
}
MiniMQTT.prototype.connect=function(){
  const self=this;
  let ws;
  try{ ws=new WebSocket(this.url,'mqtt'); }catch(e){ this.onerror(e); return; }
  ws.binaryType='arraybuffer';
  this.ws=ws;
  ws.onopen=function(){
    const payload=encStr(self.clientId);
    const vh=[0,4,0x4d,0x51,0x54,0x54,4,0x02,0,self.keepalive];
    const rem=vh.concat(payload);
    const out=[0x10]; encLen(rem.length,out);
    ws.send(new Uint8Array(out.concat(rem)));
  };
  ws.onmessage=function(ev){ self._feed(ev.data); };
  ws.onclose=function(){ self.connected=false; clearInterval(self.pingT); self.onclose(); };
  ws.onerror=function(e){ self.onerror(e); };
};
MiniMQTT.prototype._feed=function(data){
  const self=this;
  let buf=new Uint8Array(data);
  this.buf=this.buf?this._cat(this.buf,buf):buf;
  // 解析完整包
  for(;;){
    const b=this.buf;
    if(b.length<2)return;
    const r=decRemain(b,1);
    const total=r.next+r.v;
    if(b.length<total)return;
    const pkt=b.slice(0,total);
    this.buf=b.slice(total);
    this._pkt(pkt,r.next,r.v);
    if(!this.buf.length)return;
  }
};
MiniMQTT.prototype._cat=function(a,b){
  const c=new Uint8Array(a.length+b.length); c.set(a,0); c.set(b,a.length); return c;
};
MiniMQTT.prototype._pkt=function(pkt,bodyStart,remLen){
  const t=pkt[0]>>4, self=this;
  if(t===2){ // CONNACK
    const rc=pkt[bodyStart+1];
    if(rc===0){
      this.connected=true;
      const self2=this;
      clearInterval(this.pingT);
      this.pingT=setInterval(function(){ if(self2.ws&&self2.ws.readyState===1) self2.ws.send(new Uint8Array([0xC0,0])); },this.keepalive*1000/2);
      this.onopen();
    } else { this.onerror(new Error('CONNACK '+rc)); this.close(); }
  } else if(t===3){ // PUBLISH
    const qos=(pkt[0]>>1)&3;
    const d=decStr(pkt,bodyStart);
    let off=d.next;
    if(qos>0) off+=2;
    const pay=pkt.slice(off,bodyStart+remLen);
    let s='';
    for(let i=0;i<pay.length;){
      let c=pay[i++];
      if(c<0x80) s+=String.fromCharCode(c);
      else if(c<0xE0){ s+=String.fromCharCode(((c&31)<<6)|(pay[i++]&63)); }
      else { s+=String.fromCharCode(((c&15)<<12)|((pay[i++]&63)<<6)|(pay[i++]&63)); }
    }
    this.onmessage(d.s,s);
  } else if(t===9){ // SUBACK
    /* no-op */
  }
};
MiniMQTT.prototype.subscribe=function(topic){
  if(!this.ws||this.ws.readyState!==1)return;
  const id=this.pid++; if(this.pid>65000)this.pid=1;
  const rem=[id>>8,id&255].concat(encStr(topic)).concat([0]);
  const out=[0x82]; encLen(rem.length,out);
  this.ws.send(new Uint8Array(out.concat(rem)));
};
MiniMQTT.prototype.publish=function(topic,payload){
  if(!this.ws||this.ws.readyState!==1)return false;
  const tb=strBytes(topic), pb=strBytes(payload);
  const rem=[tb.length>>8,tb.length&255].concat(tb).concat(pb);
  const out=[0x30]; encLen(rem.length,out);
  try{ this.ws.send(new Uint8Array(out.concat(rem))); return true; }catch(e){ return false; }
};
MiniMQTT.prototype.close=function(){
  clearInterval(this.pingT);
  try{ if(this.ws&&this.ws.readyState===1){ this.ws.send(new Uint8Array([0xE0,0])); this.ws.close(); } }catch(e){}
  this.connected=false;
};

global.MiniMQTT=MiniMQTT;
if(typeof module!=='undefined'&&module.exports) module.exports=MiniMQTT;
})(typeof window!=='undefined'?window:global);

/* ================= 棋大师 · 核心引擎 ================= */
(function(){
'use strict';
const QM = window.QM = window.QM || {};

/* ---------- 通用工具 ---------- */
const U = QM.util = {
  clone:o=>JSON.parse(JSON.stringify(o)),
  ri:n=>Math.floor(Math.random()*n),
  pick:a=>a[U.ri(a.length)],
  shuffle(a){for(let i=a.length-1;i>0;i--){const j=U.ri(i+1);const t=a[i];a[i]=a[j];a[j]=t;}return a;},
  clamp:(v,a,b)=>v<a?a:(v>b?b:v),
  now:()=>performance.now(),
  sum:(a,f)=>a.reduce((s,x)=>s+(f?f(x):x),0)
};

/* ---------- 绘图工具 ---------- */
const G = QM.gfx = {
  rr(ctx,x,y,w,h,r){
    r=Math.min(r,w/2,h/2);
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  },
  disc(ctx,x,y,r,fill,stroke,lw){
    ctx.beginPath();ctx.arc(x,y,r,0,6.2832);
    if(fill){ctx.fillStyle=fill;ctx.fill();}
    if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||1.5;ctx.stroke();}
  },
  stone(ctx,x,y,r,o){
    o=o||{};
    if(o.shadow){ctx.save();ctx.shadowColor='rgba(0,0,0,.45)';ctx.shadowBlur=r*.5;ctx.shadowOffsetY=r*.18;}
    const gd=ctx.createRadialGradient(x-r*.35,y-r*.42,r*.12,x,y,r*1.05);
    gd.addColorStop(0,o.hi||'#fff');gd.addColorStop(.42,o.fill||'#ddd');gd.addColorStop(1,o.lo||'#666');
    ctx.beginPath();ctx.arc(x,y,r,0,6.2832);ctx.fillStyle=gd;ctx.fill();
    if(o.shadow)ctx.restore();
    if(o.ring){ctx.strokeStyle=o.ring;ctx.lineWidth=Math.max(1,r*.12);ctx.stroke();}
    if(o.text){
      ctx.fillStyle=o.color||'#fff';
      ctx.font='700 '+(o.fs||r*1.02)+'px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(o.text,x,y+r*.04);
    }
  },
  txt(ctx,t,x,y,size,color,align,weight){
    ctx.fillStyle=color||'#fff';
    ctx.font=(weight||'600')+' '+size+'px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign=align||'center';ctx.textBaseline='middle';
    ctx.fillText(t,x,y);
  },
  hexPath(ctx,x,y,r){
    ctx.beginPath();
    for(let i=0;i<6;i++){const a=Math.PI/180*(60*i-30);const px=x+r*Math.cos(a),py=y+r*Math.sin(a);i?ctx.lineTo(px,py):ctx.moveTo(px,py);}
    ctx.closePath();
  },
  line(ctx,x1,y1,x2,y2,color,w){
    ctx.strokeStyle=color;ctx.lineWidth=w||1;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  }
};

/* ---------- 引擎 ---------- */
const E = QM.engine = {
  game:null, s:null, cfg:null, view:null,
  raf:0, aiT:0, dirty:true, cw:300, ch:300, cv:null, ctx:null, hist:[], busy:false,

  start(game,cfg){
    this.stop();
    this.game=game; this.cfg=cfg;
    this.s=game.newState(cfg);
    this.view={hover:null,anim:null,hint:null,sel:null,t:0};
    this.hist=[]; this.busy=false;
    UI.showPlay();
    this.mount();
    this.resize();
    this.schedAI();
    this.loop();
  },
  /* 只建立对局状态、不切换页面：供房主在等待他人加入时预先准备局面 */
  prepare(game,cfg){
    this.game=game; this.cfg=cfg;
    this.s=game.newState(cfg);
    this.view={hover:null,anim:null,hint:null,sel:null,t:0};
    this.hist=[]; this.busy=false; this._finished=false;
  },
  stop(){ if(this.raf)cancelAnimationFrame(this.raf),this.raf=0; if(this.aiT)clearTimeout(this.aiT),this.aiT=0; },
  mount(){
    this.cv=document.getElementById('board');
    this.ctx=this.cv.getContext('2d');
    if(!this._bound){
      this._bound=1;
      const pos=e=>{
        const r=this.cv.getBoundingClientRect();
        const p=(e.touches&&e.touches[0])||e;
        return {x:p.clientX-r.left,y:p.clientY-r.top};
      };
      this.cv.addEventListener('click',e=>{ const q=pos(e); this.tap(q.x,q.y); });
      this.cv.addEventListener('mousemove',e=>{
        const q=pos(e);
        const g=this.game;
        if(g.hover){ const h=g.hover(this.s,this.layout(),q.x,q.y); if(h!==this.view.hover){this.view.hover=h;this.dirty=true;} }
      });
      this.cv.addEventListener('mouseleave',()=>{this.view.hover=null;this.dirty=true;});
      window.addEventListener('resize',()=>this.resize());
    }
  },
  resize(){
    const wrap=document.getElementById('boardWrap');
    if(!wrap||!this.cv)return;
    let w=wrap.clientWidth, h=wrap.clientHeight;
    if(h<80) h=w;
    const dpr=Math.min(window.devicePixelRatio||1,2.5);
    this.cv.width=Math.round(w*dpr); this.cv.height=Math.round(h*dpr);
    this.cv.style.width=w+'px'; this.cv.style.height=h+'px';
    this.ctx.setTransform(dpr,0,0,dpr,0,0);
    this.cw=w; this.ch=h; this.dirty=true;
  },
  layout(){ return this.game.layout(this.cw,this.ch,this.s); },
  loop(){
    const step=()=>{
      const hasAnim=this.view&&this.view.anim;
      if(this.dirty||hasAnim){
        this.dirty=false;
        const ctx=this.ctx;
        ctx.clearRect(0,0,this.cw,this.ch);
        try{
          this.game.draw(ctx,this.s,this.layout(),this.view);
          if(this.view.hint) this.game.drawHint&&this.game.drawHint(ctx,this.s,this.layout(),this.view.hint);
        }catch(err){ console.error(err); }
      }
      if(hasAnim && U.now()-this.view.anim.t0>this.view.anim.dur){ this.view.anim=null; this.dirty=true; }
      this.raf=requestAnimationFrame(step);
    };
    if(!this.raf) this.raf=requestAnimationFrame(step);
  },
  tap(x,y){
    const g=this.game;
    if(!g||this.busy||this.view.anim)return;
    if(this.s.over)return;
    if(!this.canAct()){
      UI.toast(this.cfg.online ? '还没轮到你的阵营' : '这一方由 AI 执子');
      return;
    }
    let mv=null;
    try{ mv=g.hit(this.s,x,y,this.layout()); }catch(err){ console.error(err); }
    if(mv==='again'){ this.dirty=true; this.schedAI(); return; }
    if(mv===null||mv===undefined){ if(g.onTapMiss) g.onTapMiss(this.s); this.dirty=true; return; }
    this.play(mv);
  },
  /* 当前是否轮到本地玩家操作 */
  canAct(){
    if(!this.s||this.s.over)return false;
    if(this.cfg.online) return QM.net.seat===this.s.turn;
    return this.cfg.seats[this.s.turn]==='human';
  },
  /* 该座位是否由本机/本地 AI 执子 */
  localSeat(t){
    if(this.cfg.online) return QM.net.isHost && QM.net.aiSeat(t);
    return this.cfg.seats[t]==='ai';
  },
  play(mv){
    const g=this.game;
    // 联机：非房主把着法提交给房主，由房主裁决后再广播回来
    if(this.cfg.online && !QM.net.isHost){
      if(QM.net.seat!==this.s.turn){ UI.toast('还没轮到你的阵营'); return; }
      if(QM.net.send('move',mv)){ this.view.sel=null; this.dirty=true; UI.toast('已发送，等待同步…'); }
      else UI.toast('网络未连接，着法未送出');
      return;
    }
    this.hist.push(U.clone(this.s));
    if(this.hist.length>80)this.hist.shift();
    let fx=null;
    try{ fx=g.apply(this.s,mv); }catch(err){ console.error(err); this.hist.pop(); return; }
    this.view.hint=null; this.view.sel=null;
    this.after(fx);
  },
  after(fx){
    const g=this.game;
    if(fx&&fx.anim){ this.view.anim={a:fx.anim,t0:U.now(),dur:fx.dur||380}; this.aiDelay=(fx.dur||380)+140; }
    if(g.checkOver) g.checkOver(this.s);
    this.dirty=true;
    UI.syncStatus();
    if(this.cfg.online&&QM.net.isHost) QM.net._push();   // 房主向全房间广播新局面
    if(this.s.over){ this.finish(); return; }
    this.schedAI();
  },
  /* 房主执行远端提交的着法，随后自动广播 */
  commitRemote(mv,depth){
    depth=depth||0;
    if(!this.s||this.s.over)return;
    // 等本机动画播完再落子；最多等约 2.4 秒，避免动画被节流时着法一直挂起
    if(this.view.anim&&depth<12){ setTimeout(()=>this.commitRemote(mv,depth+1),200); return; }
    if(QM.net.seat===this.s.turn)return;                 // 该座由房主本人操作，忽略
    if(QM.net.seats[this.s.turn]===null)return;           // 空座由 AI 代打，不收远端着法
    this.hist.push(U.clone(this.s));
    if(this.hist.length>80)this.hist.shift();
    let fx=null;
    try{ fx=this.game.apply(this.s,mv); }
    catch(err){ console.error(err); this.hist.pop(); QM.net._push(); return; }
    this.view.hint=null; this.view.sel=null;
    this.after(fx);
  },
  /* 远端玩家：直接套用房主广播过来的局面 */
  applyRemote(state){
    if(!state)return;
    this.s=state;
    if(!this.view) this.view={hover:null,anim:null,hint:null,sel:null,t:0};
    this.view.hint=null; this.view.sel=null; this.view.anim=null;
    this.busy=false; this.dirty=true;
    if(this.game) UI.syncStatus();
    if(this.s.over&&this.game) this.finish();
  },
  schedAI(){
    if(this.aiT)clearTimeout(this.aiT);
    if(!this.s||this.s.over)return;
    const t=this.s.turn;
    if(!this.localSeat(t))return;
    const isDemo=!this.cfg.online&&this.cfg.seats.every(x=>x==='ai');
    const base=isDemo?240:340;
    const d=Math.max(base,this.aiDelay||0);
    this.aiDelay=0;
    this.aiT=setTimeout(()=>this.aiGo(), d);
  },
  aiGo(){
    this.aiT=0;
    if(!this.s||this.s.over)return;
    const t=this.s.turn;
    if(!this.localSeat(t))return;
    this.busy=true;
    UI.syncStatus();
    setTimeout(()=>{
      let mv=null;
      try{ mv=this.game.ai(this.s,t,this.cfg.level); }catch(err){ console.error(err); }
      this.busy=false;
      if(mv===null||mv===undefined){ mv=this.fallback(); }
      if(mv){ this.play(mv); }
      else{ this.dirty=true; UI.syncStatus(); }
    },10);
  },
  fallback(){
    const g=this.game;
    if(!g.moves)return null;
    const ms=g.moves(this.s,this.s.turn);
    return ms.length?U.pick(ms):null;
  },
  undo(){
    if(this.busy||this.view.anim)return;
    if(this.cfg.online&&!QM.net.isHost){ UI.toast('联机对局中，只有房主可以悔棋'); return; }
    if(!this.hist.length){ UI.toast('没有可悔的棋了'); return; }
    // 回退到最近一个由人类操作的局面
    let st=this.hist.pop();
    while(this.hist.length && this.cfg.seats[st.turn]!=='human' && !st.over) st=this.hist.pop();
    this.s=st; this.view.hint=null; this.view.sel=null; this.view.anim=null;
    this.dirty=true; UI.syncStatus();
    if(this.s.over){ this.s.over=false; this.s.winner=null; }
    if(this.cfg.online) QM.net._push();
  },
  hint(){
    if(this.busy||this.s.over)return;
    UI.toast('正在思考…');
    setTimeout(()=>{
      let mv=null;
      try{ mv=this.game.ai(this.s,this.s.turn,Math.max(2,this.cfg.level)); }catch(e){console.error(e);}
      if(mv){ this.view.hint=mv; this.view.hintT=U.now(); this.dirty=true; UI.toast('已给出建议着法'); }
      else UI.toast('没有可走的棋');
    },30);
  },
  finish(){
    const g=this.game, s=this.s;
    const wtxt = g.resultText? g.resultText(s) : (s.winner==null?'和局':('胜方：'+g.seatName(s.winner)));
    let title='平局', icon='🤝';
    if(s.winner!==null&&s.winner!==undefined){
      if(this.cfg.online){
        const mine = QM.net.seat===s.winner;
        title = mine?'你赢了':'对方获胜'; icon = mine?'🎉':'🫡';
      } else if(this.cfg.seats[s.winner]==='ai'){ title='AI 获胜'; icon='🤖'; }
      else { title='你赢了'; icon='🎉'; }
    }
    if(this._finished) return;
    this._finished=true;
    setTimeout(()=>{ this._finished=false; },1200);
    // 战绩：仅统计有胜负意义的对局（演示与自弈不计）
    try{
      const A=QM.account;
      if(A&&A.isLogin()&&this.cfg.mode!=='eva'&&this.cfg.mode!=='solo'&&s.winner!==null&&s.winner!==undefined){
        const mine=this.cfg.online?QM.net.seat:0;
        const mySide=this.cfg.online?(QM.net.seat===s.winner):(this.cfg.seats[s.winner]!=='ai');
        A.record(mySide?'win':'lose');
      }
    }catch(e){}
    UI.modal({
      icon:icon, title:title, text:wtxt,
      btns:[{t:'再来一局',p:1,f:()=>{UI.closeModal();E.restart();}},
            {t:'换模式',f:()=>{UI.closeModal();QM.net.close();UI.openSetup(g.id);}}]
    });
  },
  restart(){
    if(this.cfg.online&&!QM.net.isHost){ UI.toast('联机对局中，只有房主可以重开'); return; }
    if(this.game) this.start(this.game,this.cfg);
    if(this.cfg.online&&QM.net.isHost) QM.net._push();
  }
};

/* ---------- 界面 ---------- */
const UI = QM.ui = {

            <div class="gm"><span class="tag on">${g.seats.length?g.seats.join('/')+' 人':'2 人'}</span>${(g.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('')}</div>
          </button>`).join('')}</div></div>`;
    }).join('');
    box.querySelectorAll('.card').forEach(b=>b.onclick=()=>this.openSetup(b.dataset.g));
  },

  /* 设置页 */
  openSetup(gid){
    const g=QM.games[gid];
    const cfg=QM.lastCfg&&QM.lastCfg[gid] ? QM.lastCfg[gid] : {mode:'pve',level:2,players:g.seats[0],first:0};
    const seatOpts = g.seats.map(n=>`<button class="opt ${cfg.players===n?'sel':''}" data-p="${n}"><b>${n} 人</b><span>${g.seatNote?g.seatNote[n]||'':''}</span></button>`).join('');
    this.el('pageSetup').innerHTML=`
      <div class="stitle">${g.icon} ${g.name}</div>
      <p class="sdesc">${g.desc}</p>
      <div class="grp"><label>对局模式</label><div class="opts" id="optMode">
        ${QM.modes.map(m=>`<button class="opt ${cfg.mode===m.id?'sel':''}" data-m="${m.id}"><b>${m.name}</b><span>${m.desc}</span></button>`).join('')}
      </div></div>
      ${g.seats.length>1?`<div class="grp"><label>对局人数</label><div class="opts" id="optP">${seatOpts}</div></div>`:''}
      <div class="grp"><label>AI 棋力</label><div class="opts" id="optLv">
        ${QM.levels.map(l=>`<button class="opt ${cfg.level===l.id?'sel':''}" data-l="${l.id}"><b>${l.name}</b><span>${l.desc}</span></button>`).join('')}
      </div></div>
      <div class="grp"><label>规则要点</label><div class="ruleBox">${g.rules}</div></div>
      <button class="big" id="btnStart">开 始 对 局</button>
      <div style="display:flex;gap:10px;margin-top:10px">
        <button class="btn" id="btnJoin" style="flex:1;padding:13px">🔑 用邀请码加入房间</button>
      </div>`;
    this.show('pageSetup');
    const pick=(box,attr,key,cast)=>{
      box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
        box.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
        b.classList.add('sel'); cfg[key]=cast?cast(b.dataset[attr]):b.dataset[attr];
      });
    };
    const startBtn=this.el('btnStart');
    const syncBtn=()=>{
      startBtn.textContent = cfg.mode==='pvp' ? '📡 创建房间，生成邀请码' : '开 始 对 局';
    };
    pick(this.el('optMode'),'m','mode',null);
    this.el('optMode').querySelectorAll('.opt').forEach(b=>b.onclick=(()=>{
      const base=b.onclick;
      return function(){ base(); syncBtn(); };
    })());
    syncBtn();
    if(g.seats.length>1) pick(this.el('optP'),'p','players',Number);
    pick(this.el('optLv'),'l','level',Number);
    this.el('btnJoin').onclick=()=>this.openJoin(gid);
    startBtn.onclick=()=>{
      QM.lastCfg=QM.lastCfg||{}; QM.lastCfg[gid]=cfg;
      const n=cfg.players;
      if(cfg.mode==='pvp'){ this.openRoom(gid,{players:n,level:cfg.level}); return; }
      const seats=[];
      for(let i=0;i<n;i++){
        if(cfg.mode==='pve') seats.push(i===0?'human':'ai');
        else if(cfg.mode==='eva') seats.push('ai');
        else seats.push('human');
      }
      E.start(g,{mode:cfg.mode,level:cfg.level,players:n,seats:seats,gameId:gid});
    };
  },

  /* ---------- 联机：创建房间 ---------- */
  openRoom(gid,cfg){
    const g=QM.games[gid], self=this;
    this._room={gid:gid,cfg:cfg};
    this.show('pageRoom');
    this.el('pageRoom').innerHTML=`
      <div class="stitle">${g.icon} ${g.name} · 联机房</div>
      <p class="sdesc">把下面的邀请码发给朋友，对方在首页或本页输入即可加入同一房间。</p>
      <div class="netBar wait" id="netBar"><span class="led"></span><span id="netTxt">正在连接服务器…</span></div>
      <div class="qrWrap">
        <canvas id="roomQr" class="qrCv"></canvas>
        <div class="qrSide">
          <div class="lb">房 间 邀 请 码</div>
          <div class="cv" id="roomCode">------</div>
          <div class="hint">面对面时让对方直接扫码；<br>异地可复制链接发送</div>
        </div>
      </div>
      <div style="display:flex;gap:10px;margin:10px 0 4px">
        <button class="btn" id="btnCopy" style="flex:1;padding:12px">📋 复制邀请码</button>
        <button class="btn" id="btnCopyLink" style="flex:1;padding:12px">🔗 复制邀请链接</button>
      </div>
      <div class="seats" id="seatList"></div>
      <div class="netBar" style="margin:6px 0 14px"><span class="led" style="background:var(--acc)"></span>
        <span id="fillTxt">未坐满的阵营由本机 AI 代打，可随时开始</span></div>
      <button class="big" id="btnGo">开 始 对 局</button>
      <button class="btn" id="btnCancel" style="width:100%;padding:13px;margin-top:10px">解散房间</button>`;

    const setNet=(cls,txt)=>{ const b=this.el('netBar'); b.className='netBar '+cls; this.el('netTxt').textContent=txt; };

    this.el('btnCancel').onclick=()=>{ QM.net.close(); this.openSetup(gid); };
    this.el('btnGo').onclick=()=>{ this.roomStart(); };
    this.el('btnCopy').onclick=()=>this.copy(QM.net.code,'邀请码已复制');
    this.el('btnCopyLink').onclick=()=>{
      const url=location.href.split('#')[0]+'#'+QM.net.code;
      this.copy(url,'邀请链接已复制，发给朋友即可直接进房');
    };

    QM.net.create(gid,{players:cfg.players,level:cfg.level},'房主',function(type,data){
      if(type==='created'){
        self.el('roomCode').textContent=data.code;
        setNet('ok','已连接 · 等待其他设备加入');
        // 绘制邀请码二维码（链接型，对方扫码即可直达房间）
        if(QM.qrui){
          const cv=self.el('roomQr');
          const r=QM.qrui.renderInvite(cv,data.code,{text:QM.qrui.inviteUrl(data.code)});
          if(!r&&cv){ cv.width=cv.height=0; self.el('roomCode').style.marginTop='10px'; }
        }
        self.renderSeats(g);
      } else if(type==='joined'||type==='left'||type==='roster'){
        self.renderSeats(g);
      } else if(type==='error'||type==='lost'){
        setNet('err',data.msg||'连接中断');
      }
    });
    this.renderSeats(g);
  },
  renderSeats(g){
    const box=this.el('seatList'); if(!box)return;
    const N=QM.net.seats||[];
    const nm=QM.net.names||[];
    let h='';
    for(let i=0;i<N.length;i++){
      const taken=!!N[i];
      const me=(i===QM.net.seat);
      h+=`<div class="seat ${me?'me':''} ${taken?'':'wait'}">
        <div class="no">${i+1}</div>
        <div class="nm">${taken?(nm[i]||('玩家'+(i+1))):'等待加入…'}${me?'（我）':''}</div>
        <div class="st">${me?'本机':(taken?'已连接':'空位 · AI 代打')}</div>
      </div>`;
    }
    box.innerHTML=h;
  },
  copy(text,okMsg){
    const done=()=>this.toast(okMsg||'已复制');
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done,()=>this.fallbackCopy(text,done));
    } else this.fallbackCopy(text,done);
  },
  fallbackCopy(text,done){
    try{
      const ta=document.createElement('textarea');
      ta.value=text; ta.style.position='fixed'; ta.style.opacity=0;
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); done();
    }catch(e){ this.toast('复制失败，请手动记录：'+text); }
  },
  /* 房主点开始 —— 进入对局，并让所有已加入设备同步开局 */
  roomStart(){
    const r=this._room; if(!r)return;
    const g=QM.games[r.gid], n=r.cfg.players;
    const seats=new Array(n).fill('human');
    E.start(g,{mode:'pvp',level:r.cfg.level,players:n,seats:seats,gameId:r.gid,online:true});
    clearInterval(QM.net.pingT);
    setTimeout(()=>QM.net._push(),400);
    this.toast('已开局，局面将自动同步给所有设备');
  },

              <div class="formRow"><input type="password" id="swPw" placeholder="输入该账号密码" autocomplete="current-password"></div>

                  else { this.el('swErr').textContent=r.msg; }
                });
                return 'keep';
              }},
              {t:'删除此账号',f:()=>{ A.remove(id); this.syncAcct(); this.closeModal(); this.toast('账号已删除'); }},
              {t:'取消',f:()=>{}}]
          });
        };
      });
      return;
    }
    this.openAcctForm('login');
  },
  openAcctForm(tab){
    const self=this, A=QM.account;
    const saved=A.list();
    this.modal({
      icon:'👤',title:'登录 / 注册',
      html:`<div class="tabs">
          <button id="tbLogin" class="${tab==='login'?'sel':''}">登录</button>
          <button id="tbReg" class="${tab==='reg'?'sel':''}">注册</button>
        </div>

        <div class="formRow" id="rowNick" style="display:${tab==='reg'?'block':'none'}">
          <input id="acNick" placeholder="昵称（可留空）" maxlength="12"></div>

        ${saved.length?`<div style="font-size:12.5px;color:var(--dim);margin:10px 0 8px">本机已存账号</div>
          ${saved.map(x=>`<div class="userItem" data-s="${this.esc(x.id)}">
            <div class="av">${A.avatarOf(x.id)}</div>

          </div>`).join('')}`:''}
        <div class="formRow tip" style="margin-top:12px">
          账号与战绩保存在<b>本设备浏览器</b>中，不会上传服务器；换设备或清理浏览器数据后需重新注册。
        </div>`,
      btns:[{t:'确定',p:1,f:()=>{ self.acctSubmit(self._acctTab||tab); return 'keep'; }},

    });

      this._acctTab=t;
      tbL.className=t==='login'?'sel':'';
      tbR.className=t==='reg'?'sel':'';
      this.el('rowNick').style.display=t==='reg'?'block':'none';
      this.el('acErr').textContent='';
    };
    tbL.onclick=()=>setTab('login');
    tbR.onclick=()=>setTab('reg');
    // 点击已存账号：填入账号名
    this.el('modalRoot').querySelectorAll('.userItem').forEach(el=>{
      el.onclick=()=>{ this.el('acId').value=el.dataset.s; this.el('acPw').focus(); };
    });
    setTimeout(()=>{ const i=this.el('acId'); i&&i.focus(); },80);
  },
  acctSubmit(tab){
    const A=QM.account;
    const id=this.el('acId').value.trim();
    const pw=this.el('acPw').value;
    const nick=(this.el('acNick')&&this.el('acNick').value||'').trim();
    const errBox=this.el('acErr');
    errBox.textContent='';
    if(!id) { errBox.textContent='请输入手机号或邮箱'; return; }
    if(!pw) { errBox.textContent='请输入密码'; return; }
    const btn=this.el('modalRoot').querySelector('.btn.pri');
    if(btn){ btn.disabled=true; btn.textContent='处理中…'; }
    const self=this;
    const finish=r=>{
      if(btn){ btn.disabled=false; btn.textContent='确定'; }
      if(r.ok){ self.closeModal(); self.syncAcct(); self.toast(tab==='reg'?'注册成功，已登录':'欢迎回来，'+r.user.nick); }
      else errBox.textContent=r.msg;
    };
    if(tab==='reg') A.register(id,pw,nick,finish);
    else A.login(id,pw,finish);
  },
  esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  },

  /* ---------- 联机：扫一扫 ---------- */
  openScan(gid){
    const self=this;
    this.show('pageRoom');
    this.el('pageRoom').innerHTML=`
      <div class="stitle">📷 扫一扫加入</div>
      <p class="sdesc">对准房主屏幕上的二维码，识别成功后会自动加入房间。</p>
      <div class="netBar" id="netBar"><span class="led"></span><span id="netTxt">准备启动相机…</span></div>
      <div class="scanBox">
        <video id="scanVid" playsinline muted></video>
        <div class="scanFrame"><i></i><i></i><i></i><i></i></div>
      </div>
      <p class="sdesc" style="margin-top:12px;text-align:center">
        识别不到？把手机拿远一点、让二维码完整落在框内，或改用手动输入。</p>
      <button class="btn" id="btnScanBack" style="width:100%;padding:13px;margin-top:6px">返回手动输入</button>`;
    const setNet=(cls,txt)=>{ const b=self.el('netBar'); if(b){b.className='netBar '+cls; self.el('netTxt').textContent=txt;} };
    const back=()=>{ QM.qrui&&QM.qrui.stopScan(); gid?self.openJoin(gid):self.openJoin(null); };
    this.el('btnScanBack').onclick=back;
    if(!QM.qrui){ setNet('err','二维码模块未加载，请手动输入'); return; }
    const video=this.el('scanVid');
    // 用一个隐藏 canvas 承载取帧，直接复用 video 的显示容器
    const cv=document.createElement('canvas');
    QM.qrui.startScan(cv,video,function(code){
      setNet('ok','已识别邀请码 '+code+'，正在加入…');
      self.toast('识别成功：'+code);
      setTimeout(function(){
        gid?self.openJoin(gid):self.openJoin(null);
        const inp=self.el('inCode');
        if(inp){ inp.value=code; setTimeout(function(){ const b=self.el('btnJoinGo'); b&&b.click(); },120); }
      },260);
    },setNet);
  },

  /* ---------- 联机：加入房间 ---------- */
  openJoin(gid){
    const self=this;
    this.show('pageRoom');
    this.el('pageRoom').innerHTML=`
      <div class="stitle">🔑 加入房间</div>
      <p class="sdesc">输入房主给你的 6 位邀请码，即可在多台设备上同场对弈。</p>
      <div class="netBar" id="netBar"><span class="led"></span><span id="netTxt">等待输入邀请码</span></div>
      <div class="grp"><label>邀请码</label>
        <input class="codeIn" id="inCode" maxlength="6" placeholder="______" autocomplete="off" autocapitalize="characters" spellcheck="false">
        <button class="btn" id="btnScan" style="width:100%;padding:13px;margin-top:10px">📷 扫一扫二维码加入</button>
      </div>
      <input class="nameIn" id="inName" maxlength="10" placeholder="你的昵称（可留空）">
      <button class="big" id="btnJoinGo" style="margin-top:16px">加 入 房 间</button>
      <button class="btn" id="btnJoinBack" style="width:100%;padding:13px;margin-top:10px">返回</button>`;
    const inp=this.el('inCode');
    inp.oninput=()=>{ inp.value=inp.value.toUpperCase().replace(/[^A-Z2-9]/g,''); };
    const go=()=>{
      const code=inp.value.trim();
      if(code.length!==6){ this.toast('请输入 6 位邀请码'); inp.focus(); return; }
      const name=(this.el('inName').value||'').trim()||('玩家'+code.slice(0,2));
      const setNet=(cls,txt)=>{ const b=self.el('netBar'); if(b){b.className='netBar '+cls; self.el('netTxt').textContent=txt;} };
      setNet('wait','正在连接房间 '+code+'…');
      self.el('btnJoinGo').disabled=true;
      QM.net.join(code,name,function(type,data){
        if(type==='joined'){
          if(data.gid===undefined||data.gid===null)return;
          setNet('ok','已加入 · 等待房主开始');
          const g=QM.games[data.gid];
          if(g){
            const n=(data.cfg&&data.cfg.players)||2;
            self._room={gid:data.gid,cfg:data.cfg};
            E.start(g,{mode:'pvp',level:(data.cfg&&data.cfg.level)||2,players:n,
              seats:new Array(n).fill('human'),gameId:data.gid,online:true});
            if(data.state) E.applyRemote(data.state);
          }
        } else if(type==='state'){
          E.applyRemote(data.state);
        } else if(type==='roster'){
          self.toast('房间成员已更新');
        } else if(type==='error'){
          setNet('err',data.msg||'连接失败');
          self.el('btnJoinGo').disabled=false;
        } else if(type==='lost'){
          setNet('err','与房间的连接已断开');
        }
      });
    };
    this.el('btnJoinGo').onclick=go;
    this.el('btnScan').onclick=()=>this.openScan(gid);
    inp.onkeydown=e=>{ if(e.key==='Enter')go(); };
    this.el('btnJoinBack').onclick=()=>{ QM.net.close(); gid?this.openSetup(gid):this.show('pageHome'); };
    setTimeout(()=>inp.focus(),80);
  },

  /* 对局页 */
  showPlay(){
    this.show('pagePlay');
    const g=E.game;
    this.el('pTitle').textContent=g.icon+' '+g.name;
    this.el('pMode').textContent = E.cfg.online
      ? ('联机 · '+(QM.net.isHost?'房主 · '+g.seatName(QM.net.seat):'你的阵营：'+g.seatName(QM.net.seat)))
      : ((QM.modes.find(m=>m.id===E.cfg.mode)||{}).name);
    this.el('pRules').textContent=g.rules;
    this.buildCtrls();
    this.syncStatus();
  },
  buildCtrls(){
    const g=E.game, box=this.el('ctrls');
    const mk=(t,f,pri,id)=>{
      const b=document.createElement('button');
      b.className='btn'+(pri?' pri':''); b.textContent=t; if(id)b.id=id; b.onclick=f; box.appendChild(b); return b;
    };
    box.innerHTML='';
    const online=!!E.cfg.online;
    (g.actions||[]).forEach(a=>mk(a.t,()=>{ const r=a.f(E.s,E.view,E); if(r==='refresh')E.dirty=true; if(r!=='keep'){E.dirty=true;UI.syncStatus();if(r==='moved')E.after(null);} },a.pri,a.id));
    if(online){
      const host=QM.net.isHost;
      mk('🔗 邀请码 '+QM.net.code,()=>{
        UI.modal({icon:'🔑',title:'房间邀请码',

/* ======== 11_net.js ======== */
/* ================= 联机房间层 · 邀请码 + 座位分配 + 状态同步 ================= */
QM.net = (function(){
'use strict';
const BROKERS=[
  'wss://broker.emqx.io:8084/mqtt',
  'wss://broker-cn.emqx.io:8084/mqtt',
  'wss://broker.hivemq.com:8884/mqtt',
  'wss://test.mosquitto.org:8081/mqtt'
];
const CHARS='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // 去掉易混字符 I O 0 1
function randCode(n){
  let s=''; const a=new Uint32Array(n);
  (self.crypto||window.crypto||{getRandomValues:x=>{for(let i=0;i<x.length;i++)x[i]=Math.random()*4294967296|0;}}).getRandomValues(a);
  for(let i=0;i<n;i++) s+=CHARS[a[i]%CHARS.length];
  return s;
}

const N={
  conn:null, code:'', topic:'', pid:'', seat:-1, isHost:false,
  gid:'', cfg:null, seats:[], names:[], on:null, bi:0, ready:false, players:0,
  myName:'', lastSeen:{}, pingT:0, status:'idle', // idle|connecting|waiting|playing|error
  hostPid:'', aiFill:true,

  /* ---------- 事件回调 ---------- */
  emit(t,d){ if(this.on) this.on(t,d||{}); },

  /* ---------- 连接 broker（多地址自动回退） ---------- */
  BROKERS:null,   // 可外部覆盖为自建服务器地址数组
  _connect(cb){
    const self=this;
    const list=this.BROKERS&&this.BROKERS.length?this.BROKERS:BROKERS;
    const tryOne=function(i){
      if(i>=list.length){ self.status='error'; self.emit('error',{msg:'无法连接服务器，请检查网络，或改用「同设备轮流 / 棋局接力码」'}); return; }
      self.bi=i;
      let done=false;
      const c=new MiniMQTT(list[i],{
        clientId:self.pid, keepalive:40,
        onopen:function(){
          if(done)return; done=true;
          self.conn=c; self.status='waiting';
          c.subscribe(self.topic);
          c.subscribe(self.topic+'/p/'+self.pid);
          setTimeout(function(){ cb&&cb(); },260);
        },
        onerror:function(){ if(!done){ try{ c.close(); }catch(e){} tryOne(i+1); } },
        onclose:function(){ if(self.conn===c&&self.status!=='idle'){ self.emit('lost',{}); } },
        onmessage:function(t,p){ self._msg(t,p); }
      });
      try{ c.connect(); }catch(e){ tryOne(i+1); }
      setTimeout(function(){ if(!done){ try{c.close();}catch(e){} tryOne(i+1); } },6000);
    };
    tryOne(0);
  },

  /* ---------- 创建房间 ---------- */
  create(gid,cfg,name,on){
    this.close();
    this.pid='H'+randCode(8);
    this.code=randCode(6);
    this.topic='qmdzv1/'+this.code;
    this.isHost=true; this.gid=gid; this.cfg=cfg; this.players=cfg.players;
    this.myName=name||'房主'; this.on=on; this.status='connecting';
    this.seats=new Array(cfg.players).fill(null);
    this.names=new Array(cfg.players).fill('');
    this.seats[0]=this.pid; this.names[0]=this.myName;
    this.seat=0;
    const self=this;
    this.emit('status',{msg:'正在创建房间…'});
    this._connect(function(){
      self.ready=true;
      // 预建初始局面：后加入的设备立刻能拿到完整棋盘，不必等房主点开始
      const g=QM.games[gid];
      if(g&&QM.engine) QM.engine.prepare(g,{mode:'pvp',level:cfg.level,players:cfg.players,
        seats:new Array(cfg.players).fill('human'),gameId:gid,online:true});
      self.emit('created',{code:self.code});
      self._roster();
      // 房主心跳：周期性广播名册，便于新设备发现
      self.pingT=setInterval(function(){ self._roster(); },4000);
    });
    return this.code;
  },

  /* ---------- 加入房间 ---------- */
  join(code,name,on){
    this.close();
    code=(code||'').trim().toUpperCase();
    if(!/^[A-Z2-9]{6}$/.test(code)){ if(on)on('error',{msg:'邀请码应为 6 位字母数字'}); return false; }
    this.pid='G'+randCode(8);
    this.code=code; this.topic='qmdzv1/'+this.code;
    this.isHost=false; this.on=on; this.status='connecting';
    this.myName=name||'玩家';
    this.emit('status',{msg:'正在连接房间 '+code+'…'});
    const self=this;
    this._connect(function(){
      self.ready=true;
      self.send('hello',{name:self.myName});
      self._helloT=setInterval(function(){
        if(self.seat<0) self.send('hello',{name:self.myName});
      },2500);
      setTimeout(function(){
        if(self.seat<0){ clearInterval(self._helloT); self.emit('error',{msg:'房间无响应：邀请码可能有误，或房主已离开'}); }
      },9000);
    });
    return true;
  },

  /* ---------- 发送 ---------- */
  send(t,d,toPid){
    if(!this.conn||!this.conn.connected)return false;
    const topic=this.topic+(toPid?('/p/'+toPid):'');
    return this.conn.publish(topic,JSON.stringify({f:this.pid,s:this.seat,t:t,d:d||null,ts:Date.now()}));
  },

  /* ---------- 收包 ---------- */
  _msg(topic,payload){
    let m; try{ m=JSON.parse(payload); }catch(e){ return; }
    if(m.f===this.pid)return;                 // 忽略自己
    const d=m.d||{}, self=this;

    if(this.isHost){
      if(m.t==='hello'){
        // 分配座位
        let idx=this.seats.indexOf(m.f);
        if(idx<0){
          for(let i=this.cfg.players-1;i>=1;i--){   // seat0 归房主
            if(!this.seats[i]){ idx=i; break; }
          }
        }
        if(idx<0){ this.send('full',{},m.f); return; }
        this.seats[idx]=m.f; this.names[idx]=d.name||('玩家'+(idx+1));
        this.send('assign',{seat:idx,gid:this.gid,cfg:this.cfg,names:this.names,
          state:QM.engine.s, over:QM.engine.s?QM.engine.s.over:false},m.f);
        this._roster();
        this.emit('joined',{seat:idx,name:this.names[idx]});
      }
      else if(m.t==='move'){
        if(m.s<0||m.s!==(QM.engine.s?QM.engine.s.turn:-1))return;   // 不是该座位的行棋权
        if(this.seats[m.s]!==m.f)return;                            // 座位与设备不匹配
        QM.engine.commitRemote(m.d);
      }
      else if(m.t==='bye'){
        const i=this.seats.indexOf(m.f);
        if(i>0){ this.seats[i]=null; this.names[i]=''; this.emit('left',{seat:i}); this._roster(); }
      }
      else if(m.t==='sync'){ this._push(); }
    } else {
      if(m.t==='assign'){
        clearInterval(this._helloT);
        this.seat=d.seat; this.gid=d.gid; this.cfg=d.cfg; this.names=d.names;
        this.hostPid=m.f; this.status='playing';
        this.emit('joined',{seat:d.seat,gid:d.gid,cfg:d.cfg,state:d.state});
      }
      else if(m.t==='state'){
        this.hostPid=m.f;
        if(this.seat<0)return;
        this.emit('state',{state:d.state,turn:d.turn});
      }
      else if(m.t==='roster'){ this.seats=d.seats; this.names=d.names; this.emit('roster',{seats:d.seats,names:d.names}); }
      else if(m.t==='full'){ clearInterval(this._helloT); this.emit('error',{msg:'房间座位已满'}); }
      else if(m.t==='bye'){
        if(m.f===this.hostPid) this.emit('error',{msg:'房主已解散房间'});
      }
      else if(m.t==='sync'){ /* guest 不响应 */ }
    }
  },

  /* ---------- 主机：广播名册 / 局面 ---------- */
  _roster(){
    if(!this.isHost)return;
    this.send('roster',{seats:this.seats,names:this.names});
    this.emit('roster',{seats:this.seats,names:this.names});
  },
  _push(){
    if(!this.isHost||!QM.engine.s)return;
    this.send('state',{state:QM.engine.s,turn:QM.engine.s.turn});
  },
  /* AI 补位：某座位无人时由主机本地代打 */
  aiSeat(seat){ return this.isHost && this.seats[seat]===null; },

  /* ---------- 关闭 ---------- */
  close(){
    try{ if(this.pingT)clearInterval(this.pingT); }catch(e){}
    try{ if(this._helloT)clearInterval(this._helloT); }catch(e){}
    this.pingT=0; this._helloT=0;
    if(this.conn){ try{ if(this.isHost&&this.seat>=0) this.send('bye',{}); }catch(e){} try{ this.conn.close(); }catch(e){} }
    this.conn=null; this.ready=false; this.seat=-1; this.status='idle'; this.isHost=false;
  }
};
return N;
})();

/* ================= 二维码 · 零依赖编码器 + 解码器 ================= */
(function(){
'use strict';
const QM = window.QM = window.QM || {};

/* ---------------- GF(256) 伽罗华域 ---------------- */
const EXP=new Uint8Array(512), LOG=new Uint8Array(256);
(function(){
  let x=1;
  for(let i=0;i<255;i++){ EXP[i]=x; LOG[x]=i; x<<=1; if(x&0x100)x^=0x11d; }
  for(let i=255;i<512;i++) EXP[i]=EXP[i-255];
})();
function gmul(a,b){ return (a&&b)?EXP[LOG[a]+LOG[b]]:0; }
function gdiv(a,b){ return (a===0)?0:EXP[(LOG[a]+255-LOG[b])%255]; }
function ginv(a){ return a?EXP[(255-LOG[a])%255]:0; }
function gpow(a,n){ return a?EXP[(LOG[a]*n)%255]:0; }

/* ---------------- Reed-Solomon ---------------- */
function rsGenPoly(deg){
  let poly=[1];
  for(let i=0;i<deg;i++){
    const nx=new Array(poly.length+1).fill(0);
    for(let j=0;j<poly.length;j++){ nx[j]^=gmul(poly[j],EXP[i]); nx[j+1]^=poly[j]; }
    poly=nx;
  }
  return poly;                       // 低次在前，最高次系数应为 1
}
/* 多项式长除法求余。
   rsGenPoly 返回的系数是"低次在前"（末尾为最高次，系数 1）；
   长除法要求除数"高次在前、首项系数为 1"，故此处必须反转。 */
function rsRemainder(data,genLow){
  const gen=genLow.slice().reverse();
  const buf=data.slice();
  for(let i=0;i<gen.length-1;i++) buf.push(0);   // 补 degree 个 0
  for(let i=0;i<data.length;i++){
    const f=buf[i];
    if(f) for(let j=0;j<gen.length;j++) buf[i+j]^=gmul(gen[j],f);
  }
  return buf.slice(data.length);
}
/* BM + Chien + Forney 纠错，返回纠正个数，-1 表示不可纠 */
function rsCorrect(msg,ecLen){
  const n=msg.length;
  const synd=new Array(ecLen).fill(0);
  let bad=false;
  for(let i=0;i<ecLen;i++){
    let s=0;
    for(let j=0;j<n;j++) s=gmul(s,EXP[i])^msg[j];
    synd[i]=s; if(s)bad=true;
  }
  if(!bad) return 0;
  // Berlekamp-Massey
  let C=[1],B=[1],L=0,m=1,b=1;
  for(let nn=0;nn<ecLen;nn++){
    let d=synd[nn];
    for(let i=1;i<=L;i++) d^=gmul(C[i]||0,synd[nn-i]);
    if(d===0){ m++; }
    else if(2*L<=nn){
      const T=C.slice();
      const coef=gdiv(d,b);
      for(let i=0;i<B.length;i++){
        const idx=i+m;
        while(C.length<=idx)C.push(0);
        C[idx]^=gmul(coef,B[i]);
      }
      L=nn+1-L; B=T; b=d; m=1;
    } else {
      const coef=gdiv(d,b);
      for(let i=0;i<B.length;i++){
        const idx=i+m;
        while(C.length<=idx)C.push(0);
        C[idx]^=gmul(coef,B[i]);
      }
      m++;
    }
  }
  // Ω(x) = S(x)·C(x) mod x^ecLen
  const Om=new Array(ecLen).fill(0);
  for(let i=0;i<ecLen;i++){
    for(let j=0;j<C.length&&j<=i;j++) Om[i]^=gmul(synd[i-j],C[j]);
  }
  if(L>C.length-1) return -1;
  let fixed=0;
  for(let i=0;i<n;i++){
    let sum=0;
    for(let k=0;k<C.length;k++) sum^=gmul(C[k],gpow(EXP[(255-(i*k)%255)%255],1));
    if(sum!==0) continue;
    const Xinv=EXP[(255-(i%255))%255];
    let om=0;
    for(let k=0;k<Om.length;k++) om^=gmul(Om[k],gpow(Xinv,k));
    let dv=0;
    for(let k=1;k<C.length;k+=2) dv^=gmul(C[k],gpow(Xinv,k-1));
    if(om!==0&&dv!==0){
      const j=n-1-i;
      if(j<0||j>=n) return -1;
      msg[j]^=gdiv(om,dv);
      fixed++;
    }
  }
  // 校验
  for(let i=0;i<ecLen;i++){
    let s=0;
    for(let j=0;j<n;j++) s=gmul(s,EXP[i])^msg[j];
    if(s!==0) return -1;
  }
  return fixed;
}

/* ---------------- 版本 / 纠错参数表 ---------------- */
/* 每项：[每块纠错码字, [[块数, 该组每块数据码字], ...]] */
const ECC_L={1:[7,[[1,19]]],2:[10,[[1,34]]],3:[15,[[1,55]]],4:[20,[[1,80]]],5:[26,[[1,108]]],
  6:[18,[[2,68]]],7:[20,[[2,78]]],8:[24,[[2,97]]],9:[30,[[2,116]]],10:[18,[[2,68],[2,69]]]};
const ECC_M={1:[10,[[1,16]]],2:[16,[[1,28]]],3:[26,[[1,44]]],4:[18,[[2,32]]],5:[24,[[2,43]]],
  6:[16,[[4,27]]],7:[18,[[4,31]]],8:[22,[[2,38],[2,39]]],9:[22,[[3,36],[2,37]]],10:[26,[[4,43],[1,44]]]};
const EC_TBL={L:ECC_L,M:ECC_M};
const EC_BITS={L:1,M:0};
function dataCapacity(v,ec){
  const t=EC_TBL[ec][v];
  return t[1].reduce((s,g)=>s+g[0]*g[1],0);
}
function alignPos(v){
  if(v===1)return [];
  const n=Math.floor(v/7)+2;
  const size=v*4+17;
  const step=Math.ceil((v*4+4)/(n*2-2))*2;
  const r=[6];
  for(let p=size-7;r.length<n;p-=step) r.splice(1,0,p);
  return r;
}

/* ---------------- 编码 ---------------- */
function utf8Bytes(str){
  const out=[];
  for(const ch of String(str)){
    let cp=ch.codePointAt(0);
    if(cp<0x80) out.push(cp);
    else if(cp<0x800){ out.push(0xC0|(cp>>6),0x80|(cp&63)); }
    else if(cp<0x10000){ out.push(0xE0|(cp>>12),0x80|((cp>>6)&63),0x80|(cp&63)); }
    else { out.push(0xF0|(cp>>18),0x80|((cp>>12)&63),0x80|((cp>>6)&63),0x80|(cp&63)); }
  }
  return out;
}
function bytesToStr(b){
  let s='';
  for(let i=0;i<b.length;){
    const c=b[i++];
    if(c<0x80) s+=String.fromCharCode(c);
    else if(c<0xE0) s+=String.fromCharCode(((c&31)<<6)|(b[i++]&63));
    else if(c<0xF0) s+=String.fromCharCode(((c&15)<<12)|((b[i++]&63)<<6)|(b[i++]&63));
    else {
      const cp=((c&7)<<18)|((b[i++]&63)<<12)|((b[i++]&63)<<6)|(b[i++]&63);
      s+=String.fromCodePoint?String.fromCodePoint(cp):String.fromCharCode(cp);
    }

  return s;
}
/* 生成 QR 矩阵：返回 {size, modules[size][size](bool), version, mask, ec} */
function encode(text,ec,forceMask){
  ec=ec||'M';

  const lenBits=data.length>255?16:8;
  let ver=0;
  for(let v=1;v<=10;v++){
    const cap=dataCapacity(v,ec);
    const need=4+lenBits+data.length*8;
    if(cap*8>=need && (v>=10||lenBits===8||true)){ ver=v; break; }
  }
  if(!ver) throw new Error('内容过长');
  if(ver>=10&&lenBits===8) return encode(text,ec==='M'?'L':ec);   // 超长降级

  const size=ver*4+17;
  const bits=[];
  const push=(val,n)=>{ for(let i=n-1;i>=0;i--) bits.push((val>>>i)&1); };
  push(4,4);                       // byte mode
  push(data.length,lenBits);

  for(let i=0;i<bits.length;i+=8){
    let v=0; for(let k=0;k<8;k++) v=(v<<1)|(bits[i+k]||0);
    bytes.push(v);
  }
  const pads=[0xEC,0x11];
  let pi=0;
  while(bytes.length<dataCapacity(ver,ec)) bytes.push(pads[pi++%2]);
